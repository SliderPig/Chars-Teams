plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = '1.0'
group = 'com.example.charteams'

base {
    archivesName = 'charteams'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

minecraft {
    mappings channel: 'official', version: '1.20.1'

    runs {
        client {
            workingDirectory project.file('run')
            mods {
                charteams {
                    source sourceSets.main
                }
            }
        }
        server {
            workingDirectory project.file('run-server')
            args '--nogui'
            jvmArg '-Xmx1500M'
            mods {
                charteams {
                    source sourceSets.main
                }
            }
        }
    }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.3.0'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

// gradlew build -Psmoke -x test: puts ClientChecks in the jar so tools/run_real_client.py can walk through the real game. Never in a normal build.
if (project.hasProperty('smoke')) {
    sourceSets.main.java.srcDir 'src/smoke/java'
}

tasks.named('jar', Jar) {
    manifest {
        attributes([
            'Specification-Title'   : 'charteams',
            'Specification-Version' : '1',
            'Implementation-Title'  : project.name,
            'Implementation-Version': project.jar.archiveVersion
        ])
    }
}
